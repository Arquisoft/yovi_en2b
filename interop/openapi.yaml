openapi: 3.0.3

info:
  title: YOVI Bot Interoperability API – play
  description: |
    API that bots consume in order to be able to play a Game Y game against an opponent.

    This document describes the `play` method, which allows bots and external
    clients to interact with the application by submitting a board position and
    receiving the engine's next move.

    Communication between the TypeScript application and the Rust bot engine is
    carried out via JSON messages following **YEN (Y Exchange Notation)**.
  version: 1.0.0

servers:
  - url: https://api.micrati.com/interop
    description: Production
  - url: http://localhost:3001
    description: Local development server

tags:
  - name: Play
    description: Stateless bot move endpoint
  - name: Monitoring
    description: Service health

# ── Paths ─────────────────────────────────────────────────────────────────────

paths:

  /health:
    get:
      summary: Health check
      tags:
        - Monitoring
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                    example: "2026-04-05T20:00:00.000Z"
                  uptime:
                    type: number
                    example: 3600.5

  /play:
    get:
      summary: Request the next bot move
      tags:
        - Play
      description: |
        Exposes the `play` method as defined in the project specification.

        The caller submits the current board state using the **YEN notation**
        as a JSON-encoded query parameter and optionally selects a bot.
        The method returns the engine's chosen move as barycentric coordinates,
        or a special action such as `"swap"` (pie rule) or `"resign"`.

        ### Example — normal move
        ```
        curl -G "http://localhost:3001/play" \
          --data-urlencode 'position={"size":3,"turn":0,"players":["B","R"],"layout":"./B./..."}'
        ```
        Response: `{"coords":{"x":1,"y":1,"z":0}}`

        ### Example — swap action (pie rule)
        Response: `{"action":"swap"}`

        ### Bot resolution order
        The bot to use is resolved with the following priority:

        1. **`bot_id`** – explicit identifier of a registered Rust bot
           (e.g. `"random_bot"`, `"fast_bot"`, `"smart_bot"`).
        2. **`strategy`** – difficulty hint that maps internally to a bot.
           Consulted only when `bot_id` is absent.
        3. **Default** – `random_bot` is used when neither field is provided.

        | `strategy` value | Resolved bot   |
        |------------------|----------------|
        | `EASY`           | `random_bot`   |
        | `MEDIUM`         | `fast_bot`     |
        | `HARD`           | `smart_bot`    |

        Strategy matching is case-insensitive. Both fields may be provided
        simultaneously; `bot_id` always takes precedence over `strategy`.

        ### YEN layout format
        The `layout` string encodes the board row by row, separated by `/`.
        Row `r` (0-indexed from the top) contains exactly `r + 1` cells.
        Valid cell characters are:

        | Character | Meaning |
        |-----------|---------|
        | `.`       | Empty cell |
        | `B`       | Piece belonging to player Blue (`turn = 0`) |
        | `R`       | Piece belonging to player Red  (`turn = 1`) |

        **Example** – size-4 board mid-game (R's turn):
        ```json
        {
          "size": 4,
          "turn": 1,
          "players": ["B", "R"],
          "layout": "B/.B/RB./B..R"
        }
        ```

        ### Coordinates
        The Rust engine represents board cells using **barycentric coordinates**
        `(x, y, z)` where `x + y + z = size − 1` and `x, y, z ≥ 0`.

        For a size-4 board the cell coordinates are:

        ```
                    (3,0,0)
                (2,0,1)  (2,1,0)
            (1,0,2)  (1,1,1)  (1,2,0)
        (0,0,3)  (0,1,2)  (0,2,1)  (0,3,0)
        ```
      operationId: play
      parameters:
        - name: position
          in: query
          required: true
          description: |
            The current board state encoded as a **JSON string** in YEN notation.
            Must be URL-encoded when sent as a query parameter.

            Example value (before URL-encoding):
            `{"size":3,"turn":0,"players":["B","R"],"layout":"./B./..."}`
          schema:
            type: string
          examples:
            position_only:
              summary: Size-3 board, B's turn
              value: '{"size":3,"turn":0,"players":["B","R"],"layout":"./B./..."}'
            mid_game:
              summary: Size-4 board mid-game, R's turn
              value: '{"size":4,"turn":1,"players":["B","R"],"layout":"B/.B/RB./B..R"}'
        - name: bot_id
          in: query
          required: false
          description: |
            Identifier of a specific bot registered in the Rust engine.
            When provided, takes priority over `strategy`.

            Available bots:
            - `random_bot` — selects a random legal move.
            - `fast_bot` — uses Minimax with alpha-beta pruning and
              iterative deepening within a time limit.
            - `smart_bot` — uses Minimax with alpha-beta pruning and
              iterative deepening with more freedom to search deeper.

            Any value not in this list results in a **404 BOT_NOT_FOUND** error.
          schema:
            type: string
            enum: [random_bot, fast_bot, smart_bot]
          example: fast_bot
        - name: strategy
          in: query
          required: false
          description: |
            Difficulty level hint. Consulted only when `bot_id` is absent.
            Maps to a registered bot internally.

            | Value    | Resolved bot   |
            |----------|----------------|
            | `EASY`   | `random_bot`   |
            | `MEDIUM` | `fast_bot`     |
            | `HARD`   | `smart_bot`    |

            Matching is **case-insensitive** (`"hard"` and `"HARD"` are equivalent).
          schema:
            type: string
            enum: [EASY, MEDIUM, HARD]
          example: HARD
      responses:
        '200':
          description: |
            The bot's move was calculated successfully.

            Returns either:
            - A **move** response with the barycentric coordinates of the chosen
              cell: `{"coords":{"x":1,"y":1,"z":0}}`
            - A **special action** such as swap (pie rule) or resign:
              `{"action":"swap"}` or `{"action":"resign"}`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayResponse'
              examples:
                normal_move:
                  summary: Bot plays a cell — barycentric coordinates
                  value:
                    coords:
                      x: 1
                      y: 1
                      z: 0
                swap_action:
                  summary: Bot invokes the pie rule (swap)
                  value:
                    action: swap
                resign_action:
                  summary: Bot resigns
                  value:
                    action: resign
        '400':
          description: |
            **INVALID_POSITION** — the `position` query parameter is absent,
            not valid JSON, or the YEN object is structurally invalid.

            This is returned when any of the following conditions are met:
            - `position` is missing from the query string.
            - `position` is not valid JSON.
            - `position` is not a JSON object (e.g. a number or string).
            - `position` is missing a required field (`size`, `turn`, `players`,
              or `layout`).
            - `size` is not a positive integer.
            - `turn` is not `0` or `1`.
            - `players` is an empty array.
            - `layout` has a number of rows that does not match `size`.
            - A row in `layout` has the wrong number of cells.
            - `layout` contains characters other than `.`, `B`, or `R`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                missing_position:
                  summary: position parameter is absent
                  value:
                    code: INVALID_POSITION
                    message: 'Query parameter "position" is required and must be a JSON-encoded YEN object.'
                invalid_json:
                  summary: position is not valid JSON
                  value:
                    code: INVALID_POSITION
                    message: 'Query parameter "position" is not valid JSON.'
                invalid_yen_object:
                  summary: position is not a valid YEN object
                  value:
                    code: INVALID_POSITION
                    message: 'The "position" parameter is not a valid YEN object. Expected { size: number, turn: number, players: string[], layout: string }.'
        '404':
          description: |
            **BOT_NOT_FOUND** — the `bot_id` supplied in the request is not
            registered in the Rust engine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: BOT_NOT_FOUND
                message: "Bot 'ghost_bot' is not registered in the engine."
        '422':
          description: |
            **NO_MOVES_AVAILABLE** — the board position has no legal moves.
            This occurs when the board is full or no valid placement exists
            for the current player.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: NO_MOVES_AVAILABLE
                message: No legal moves are available for the given position.
        '500':
          description: |
            **INTERNAL_ERROR** — an unexpected server-side error occurred that
            is not covered by the more specific error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: INTERNAL_ERROR
                message: An unexpected error occurred.
        '502':
          description: |
            **ENGINE_ERROR** — the Rust bot engine returned an unexpected error
            or an unrecognised failure occurred during communication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: ENGINE_ERROR
                message: "Unexpected error from the bot engine: connect ECONNREFUSED"
        '503':
          description: |
            **ENGINE_TIMEOUT** — the Rust bot engine did not respond within the
            configured timeout window. This may happen when the minimax bot
            searches deeply on large boards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: ENGINE_TIMEOUT
                message: The bot engine did not respond in time.

# ── Components ────────────────────────────────────────────────────────────────

components:

  schemas:

    YEN:
      type: object
      description: |
        **Y Exchange Notation** — the canonical JSON representation of a
        Game Y board state at a specific point in time.

      required:
        - size
        - turn
        - players
        - layout
      properties:
        size:
          type: integer
          minimum: 1
          description: |
            Edge length of the triangular board. A board of `size` N contains
            `N * (N + 1) / 2` cells in total.
          example: 4
        turn:
          type: integer
          enum: [0, 1]
          description: |
            Index of the player whose turn it is to move.

            | Value | Player |
            |-------|--------|
            | `0`   | Blue (B) |
            | `1`   | Red  (R) |
          example: 1
        players:
          type: array
          description: |
            Token characters for each player. Always `["B", "R"]` for the
            classic two-player Game Y.
          minItems: 1
          items:
            type: string
            maxLength: 1
          example: ["B", "R"]
        layout:
          type: string
          description: |
            Compact string encoding of the board. Rows are separated by `/`
            and grow from 1 cell at the top to `size` cells at the bottom.
            Row `r` (0-indexed) must contain exactly `r + 1` characters.

            Valid cell characters: `.` (empty), `B` (Blue), `R` (Red).
          pattern: '^[BR.]+(/[BR.]+)*$'
          example: "B/.B/RB./B..R"

    PlayResponse:
      description: |
        Response returned by a successful call to the `play` method.

        One of two shapes:
        - **Move**: `{"coords":{"x":1,"y":1,"z":0}}` — the cell the bot chose,
          expressed as barycentric coordinates.
        - **Action**: `{"action":"swap"}` or `{"action":"resign"}` — a special
          action when the bot invokes the pie rule or resigns.
      oneOf:
        - $ref: '#/components/schemas/MoveResponse'
        - $ref: '#/components/schemas/ActionResponse'

    MoveResponse:
      type: object
      description: The bot chose a cell on the board.
      required:
        - coords
      properties:
        coords:
          $ref: '#/components/schemas/Coordinates'

    ActionResponse:
      type: object
      description: The bot performed a special action (swap, resign, etc.).
      required:
        - action
      properties:
        action:
          type: string
          description: Name of the action performed.
          example: swap

    Coordinates:
      type: object
      description: |
        Barycentric coordinates of a cell on the Game Y board.
        The values satisfy `x + y + z = size − 1` with `x, y, z ≥ 0`.
      required:
        - x
        - y
        - z
      properties:
        x:
          type: integer
          minimum: 0
          example: 1
        y:
          type: integer
          minimum: 0
          example: 1
        z:
          type: integer
          minimum: 0
          example: 0

    ApiError:
      type: object
      description: |
        Structured error body returned on all non-2xx responses. The `code`
        field is machine-readable and stable; `message` is human-readable and
        intended for debugging.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error identifier.
          enum:
            - INVALID_POSITION
            - BOT_NOT_FOUND
            - NO_MOVES_AVAILABLE
            - ENGINE_ERROR
            - ENGINE_TIMEOUT
            - INTERNAL_ERROR
          example: INVALID_POSITION
        message:
          type: string
          description: Human-readable description of what went wrong.
          example: 'Query parameter "position" is required and must be a JSON-encoded YEN object.'
